[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agents-system-app-api"
version = "0.1.0"
description = "Installable Python API for the Agents System console"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "unix-socket-client==0.1.0",
]

[project.scripts]
asystem = "app_api.__main__:main"

[tool.setuptools]
package-dir = { app_api = ".", lib = "../lib", shared = "../shared" }
packages = [
    "app_api",
    "app_api.app",
    "app_api.app.services",
    "app_api.app.models",
    "app_api.app.exceptions",
    "lib",
    "lib.configuration",
    "shared",
    "shared.exceptions",
]
include-package-data = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

