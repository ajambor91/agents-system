[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agents-system-control-plane"
version = "0.1.0"
description = "Agents System public application API and console adapter"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["agents-system-app-api==0.1.0", "unix-socket-client==0.1.0"]

[tool.setuptools]
package-dir = { agents_system = "." }
packages = [
    "agents_system",
    "agents_system.app",
    "agents_system.app.services",
    "agents_system.app.models",
    "agents_system.app.exceptions",
]
include-package-data = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
