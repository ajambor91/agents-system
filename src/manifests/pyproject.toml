[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agents-system-manifests"
version = "0.1.0"
description = "Manifest application, validation models and strategy dispatcher for Agents System"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "manifests-loader==0.1.0",
    "agents_system_cli==0.1.0",
    "pycairo",
]

[tool.setuptools]
package-dir = { manifests = "." }
packages = [
    "manifests",
    "manifests.app",
    "manifests.app.helpers",
    "manifests.app.helpers.manifests_validator",
    "manifests.app.consts",
    "manifests.app.exceptions",
    "manifests.app.enums",
    "manifests.app.models",
    "manifests.app.models.environment",
    "manifests.app.models.modules",
]
include-package-data = false

[project.scripts]
manifest-validate = "manifests.__main__:main"
