[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agents_manager_runtime"
version = "0.1.0"
description = "Agent data runtime and agent installation application"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "agents_system_cli==0.1.0",
    "redis>=5,<7",
]

[tool.setuptools]
package-dir = { agents_manager_runtime = "." }
packages = [
    "agents_manager_runtime",
    "agents_manager_runtime.app",
    "agents_manager_runtime.app.agent",
    "agents_manager_runtime.app.services",
]
include-package-data = false

[tool.setuptools.package-data]
agents_manager_runtime = ["resources/*.json", "kroki.md"]
