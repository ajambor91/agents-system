[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "manifests-loader"
version = "0.1.0"
description = "Passive JSON manifest reader"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["json-loader==0.1.0"]

[tool.setuptools]
package-dir = { manifests_loader = ".", "lib.manifests_loader" = "." }
packages = ["manifests_loader", "lib.manifests_loader"]
include-package-data = false
