[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "compose-loader"
version = "0.1.0"
description = "Compose YAML reader with nested Python data models"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6,<7"]

[tool.setuptools]
package-dir = { compose_loader = ".", "lib.compose_loader" = "." }
packages = [
    "compose_loader",
    "compose_loader.models",
    "lib.compose_loader",
    "lib.compose_loader.models",
]
include-package-data = false
