[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agents-system-modules-catalog"
version = "0.1.0"
description = "Python models and factories for module and command catalogs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "agents-system-manifests==0.1.0",
]

[tool.setuptools]
package-dir = { modules_catalog = ".", "lib.modules_catalog" = "." }
packages = [
    "modules_catalog",
    "modules_catalog.models",
    "modules_catalog.factories",
    "lib.modules_catalog",
    "lib.modules_catalog.models",
    "lib.modules_catalog.factories",
]
include-package-data = false
