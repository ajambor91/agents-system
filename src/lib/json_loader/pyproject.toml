[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "json-loader"
version = "0.1.0"
description = "UTF-8 JSON file and string reader"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[tool.setuptools]
package-dir = { json_loader = ".", "lib.json_loader" = "." }
packages = ["json_loader", "lib.json_loader"]
include-package-data = false
