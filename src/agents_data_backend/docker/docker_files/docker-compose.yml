services:
  app-data:
    build: 
      context: .
      dockerfile: app-data/Dockerfile
    ports:
      - "3000:3000"
    environment:
      - REDIS_CACHE_URL=redis://redis-cache:6379
      - MONGO_URL=mongodb://root:example@mongodb:27017/appdb?authSource=admin
      - MESSAGE_CACHE_TTL_SECONDS=604800
    depends_on:
      - redis-cache
      - mongodb
    networks:
      - backend-network

  app-comm:
    build: 
      context: .
      dockerfile: app-comm/Dockerfile
    ports:
      - "3001:3001"
    environment:
      - REDIS_STREAM_URL=redis://redis-streams:6380
      - APP_DATA_URL=http://app-data:3000
    depends_on:
      - redis-streams
      - app-data
    networks:
      - backend-network

  app-sync:
    build: 
      context: .
      dockerfile: app-sync/Dockerfile
    ports:
      - "3002:3002"
    volumes:
      - ./shared-data:/app/shared-data 
    environment:
      - REDIS_STREAM_URL=redis://redis-streams:6380
      - APP_DATA_URL=http://app-data:3000
    depends_on:
      - redis-streams
    networks:
      - backend-network

  redis-cache:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "500mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "6379:6379"
    networks:
      - backend-network

  redis-streams:
    image: redis:7-alpine
    command: ["redis-server", "--port", "6380", "--save", "", "--appendonly", "no", "--maxmemory", "500mb", "--maxmemory-policy", "noeviction"]
    ports:
      - "6380:6380"
    networks:
      - backend-network

  mongodb:
    image: mongo:6
    environment:
      - MONGO_INITDB_ROOT_USERNAME=root
      - MONGO_INITDB_ROOT_PASSWORD=example
      - MONGO_INITDB_DATABASE=appdb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - backend-network

volumes:
  mongodb_data:

networks:
  backend-network:
    driver: bridge
